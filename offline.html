<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#094B2D">
  <title>Pause & Plate — Hors connexion</title>
  <style>
    :root{color-scheme:light;--green:#094B2D;--gold:#D9A51E;--cream:#F7F1E5;--ink:#18251b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
    main{width:min(520px,100%);padding:34px;text-align:center;background:#fff;border:1px solid #094b2d24;border-radius:24px;box-shadow:0 18px 50px #18251b18}
    .mark{width:84px;height:84px;display:grid;place-items:center;margin:0 auto 18px;border-radius:22px;background:var(--green);color:#fff;font-family:Georgia,serif;font-size:32px;font-weight:700;box-shadow:inset 0 0 0 4px var(--gold)}
    h1{margin:0 0 10px;color:var(--green);font-size:25px}
    p{margin:0 0 22px;color:#526057;line-height:1.6}
    button{border:0;border-radius:11px;padding:12px 20px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">PP</div>
    <h1>Connexion indisponible</h1>
    <p>Pause & Plate Manager ne peut pas joindre Internet. Vérifiez la connexion puis réessayez. Les informations déjà enregistrées localement restent protégées sur cet appareil.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
