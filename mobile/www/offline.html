<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#094B2D">
  <title>Pause & Plate — Connexion indisponible</title>
  <style>
    :root{--green:#094B2D;--gold:#D9A51E;--cream:#F7F1E5;--ink:#18251b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;text-align:center}
    main{width:min(500px,100%);padding:34px;background:#fff;border-radius:24px;box-shadow:0 18px 50px #18251b18}
    .mark{width:88px;height:88px;display:grid;place-items:center;margin:0 auto 18px;border-radius:23px;background:var(--green);box-shadow:inset 0 0 0 4px var(--gold);color:#fff;font-family:Georgia,serif;font-size:34px;font-weight:700}
    h1{margin:0 0 10px;color:var(--green);font-size:25px}
    p{margin:0 0 22px;color:#667085;line-height:1.6}
    button{border:0;border-radius:11px;padding:12px 20px;background:var(--green);color:#fff;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="mark">PP</div>
    <h1>Connexion indisponible</h1>
    <p>Vérifiez Internet puis réessayez. Aucune donnée Firebase n’est enregistrée dans cette page d’erreur.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
